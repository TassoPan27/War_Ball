<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WARBall — Classic Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --field-green: #1E4230;
    --field-green-dark: #142E20;
    --dirt: #B08862;
    --dirt-dark: #8F6D4C;
    --parchment: #EFE8D8;
    --parchment-dim: #E4DBC6;
    --ink: #1B2430;
    --ink-soft: #4A5568;
    --clay: #9C4B2E;
    --clay-dark: #7E3B22;
    --gold: #C9A227;
    --line: rgba(27, 36, 48, 0.14);
    --card-bg: #FBF8F1;
    --grass: #5B8A3C;
    --infield: #F2A96B;
    --chalk: #FBE3A5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--parchment);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }

  .display { font-family: 'Oswald', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  header {
    background: var(--field-green);
    color: var(--parchment);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 4px solid var(--field-green-dark);
  }

  .wordmark {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
  }
  .wordmark span { color: var(--gold); }
  .mode-tag {
    font-family: 'Oswald', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    color: var(--parchment-dim);
    border: 1px solid rgba(239,232,216,0.35);
    padding: 3px 10px;
    border-radius: 2px;
  }

  /* ---------- Randomizer ---------- */
  .randomizer {
    max-width: 1180px;
    margin: 28px auto 0;
    padding: 0 28px;
  }

  .reel-row {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 22px 28px;
    display: flex;
    align-items: center;
    gap: 24px;
    box-shadow: 0 10px 0 rgba(20, 46, 32, 0.12);
  }

  .reel {
    flex: 1;
    background: var(--field-green);
    border-radius: 3px;
    padding: 16px 20px;
    overflow: hidden;
    position: relative;
    height: 62px;
  }

  .reel-label {
    position: absolute;
    top: 4px;
    left: 20px;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    color: var(--gold);
    font-family: 'Oswald', sans-serif;
    z-index: 2;
  }

  .reel-value {
    color: var(--parchment);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 1.3rem;
    margin-top: 12px;
    transition: transform 0.08s linear;
  }

  .reel.spinning .reel-value {
    animation: reel-blur 0.08s linear infinite;
  }

  @keyframes reel-blur {
    0% { transform: translateY(0px); opacity: 1; }
    50% { transform: translateY(-4px); opacity: 0.5; }
    100% { transform: translateY(0px); opacity: 1; }
  }

  .spin-btn {
    background: var(--clay);
    color: var(--parchment);
    border: none;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.04em;
    font-size: 0.95rem;
    padding: 18px 30px;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.15s ease;
    flex-shrink: 0;
  }
  .spin-btn:hover { background: var(--clay-dark); }
  .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- Main layout ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 28px 80px;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 24px;
  }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }

  .section-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    margin: 0 0 12px;
    color: var(--field-green);
  }

  /* ---------- Pool ---------- */
  .pool-panel {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 18px;
    max-height: 720px;
    overflow-y: auto;
  }

  .pool-card {
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color 0.15s ease;
  }
  .pool-card:hover { border-color: var(--clay); }
  .pool-card.selected { border-color: var(--clay); background: #FDF4EE; }
  .pool-card.locked { opacity: 0.4; pointer-events: none; }

  .pool-hint { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 10px; }

  .pool-card .pinfo { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .pool-card .pname { font-weight: 600; font-size: 0.92rem; }
  .pos-badge {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--field-green);
    background: var(--parchment-dim);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 1px 6px;
    min-width: 46px;
    text-align: center;
    flex-shrink: 0;
  }
  .pool-card .pstat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.1;
    flex-shrink: 0;
  }
  .pool-card .pstat-label {
    font-family: 'Oswald', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
  }
  .pool-card .pwar {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--clay);
    font-size: 0.95rem;
  }

  /* ---------- Right column: diamond + order ---------- */
  .field-order-row {
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 20px;
    margin-bottom: 20px;
  }

  @media (max-width: 640px) {
    .field-order-row { grid-template-columns: 1fr; }
  }

  .diamond-panel, .order-panel, .bullpen-panel {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 18px;
  }

  .diamond-wrap { display: flex; justify-content: center; }

  .field .grass { fill: var(--grass); stroke: var(--grass); stroke-linejoin: round; }
  .field .dirt { fill: var(--infield); stroke: var(--infield); stroke-linejoin: round; }
  .field .chalk-fill { fill: var(--chalk); }
  .field .chalk-line { stroke: var(--chalk); fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .pos-slot {
    cursor: pointer;
  }
  .pos-slot circle {
    fill: var(--parchment);
    stroke: var(--ink-soft);
    stroke-width: 2;
    stroke-dasharray: 4 3;
    transition: fill 0.15s ease, stroke 0.15s ease;
  }
  .pos-slot.filled circle {
    fill: var(--clay);
    stroke: var(--clay-dark);
    stroke-dasharray: none;
  }
  .pos-slot:hover circle { stroke: var(--clay); }
  .pos-slot text.pos-label {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 600;
    fill: var(--ink-soft);
    text-anchor: middle;
  }
  .pos-slot.filled text.pos-label { fill: var(--parchment); }
  .pos-slot text.pos-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    fill: var(--parchment);
    text-anchor: middle;
  }

  .dh-slot {
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 2px dashed var(--ink-soft);
    border-radius: 3px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .dh-slot.filled {
    border-style: solid;
    border-color: var(--clay-dark);
    background: var(--clay);
    color: var(--parchment);
  }
  .dh-slot .dh-label { font-family: 'Oswald', sans-serif; font-size: 0.72rem; letter-spacing: 0.06em; }

  /* ---------- Order panel ---------- */
  .order-slot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 2px;
    background: var(--parchment-dim);
    font-size: 0.82rem;
    margin-bottom: 5px;
    min-height: 30px;
    cursor: pointer;
  }
  .order-slot.empty { color: var(--ink-soft); font-style: italic; }
  .order-slot .order-num {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--field-green);
    width: 14px;
  }

  .order-hint {
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-top: 8px;
    line-height: 1.4;
  }

  .order-tray {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .order-chip {
    background: var(--parchment-dim);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 4px 8px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .order-chip:hover { border-color: var(--clay); }

  /* ---------- Bullpen ---------- */
  .bullpen-slots {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  @media (max-width: 640px) {
    .bullpen-slots { grid-template-columns: repeat(2, 1fr); }
  }
  .bp-slot {
    border: 2px dashed var(--ink-soft);
    border-radius: 3px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }
  .bp-slot .bp-role {
    font-family: 'Oswald', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
    display: block;
  }
  .bp-slot.filled {
    border-style: solid;
    border-color: var(--clay-dark);
    background: var(--clay);
    color: var(--parchment);
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">WAR<span>Ball</span></div>
  <div class="mode-tag">CLASSIC MODE — ERA DRAFT</div>
</header>

<div class="randomizer">
  <div class="reel-row">

      <div class="reel-label">TEAM</div>

  <div>
    <div class="field-order-row">
      <div class="diamond-panel">
        <h2 class="section-title">DIAMOND</h2>
        <div class="diamond-wrap">
          <svg viewBox="0 0 480 470" width="100%" style="max-width: 420px;" aria-label="Baseball diamond">
            <g class="field">
              <!-- Outfield fan and infield dirt arc share a center, so the grass band is even all the way around -->
              <path class="grass" stroke-width="16" d="M 240 395 L 9.4 227.4 A 236 236 0 0 1 470.6 227.4 Z"/>

              <polygon class="grass" stroke-width="10" points="240,175.6 342.7,278.3 240,381 137.3,278.3"/>

              <circle class="dirt" cx="240" cy="278.3" r="24" stroke="none"/>
              <rect class="chalk-fill" x="229" y="275.3" width="22" height="6" rx="3"/>

              <line class="chalk-line" stroke-width="7" x1="216" y1="388" x2="35" y2="207"/>

              <rect class="chalk-fill" x="-7" y="-7" width="14" height="14" rx="2.5" transform="translate(356.7 278.3) rotate(45)"/>
              <rect class="chalk-fill" x="-7" y="-7" width="14" height="14" rx="2.5" transform="translate(240 161.7) rotate(45)"/>

              <path class="chalk-line" stroke-width="5" d="M 227 384 H 219 V 406 H 227"/>

              <text class="pos-name" x="352" y="242"></text>

            <g class="pos-slot" data-pos="2B">
              <circle cx="298" cy="196" r="22"/>

            </g>
            <g class="pos-slot" data-pos="SS">
              <circle cx="182" cy="196" r="22"/>

              <text class="pos-name" x="182" y="204"></text>
            </g>
            <g class="pos-slot" data-pos="3B">
              <circle cx="128" cy="234" r="22"/>
              <text class="pos-label" x="128" y="230">3B</text>
              <text class="pos-name" x="128" y="242"></text>
            </g>
            <g class="pos-slot" data-pos="LF">
              <circle cx="103" cy="114" r="22"/>

            </g>
            <g class="pos-slot" data-pos="CF">
              <circle cx="240" cy="64" r="22"/>

              <text class="pos-name" x="240" y="72"></text>
            </g>
            <g class="pos-slot" data-pos="RF">
              <circle cx="377" cy="114" r="22"/>

          </svg>
        </div>
        <div class="dh-slot" id="dh-slot" data-pos="DH">
          <span class="dh-label">DH</span>
          <span id="dh-name" style="color: var(--ink-soft); font-style: italic;">empty</span>
        </div>
      </div>

      <div class="order-panel">
        <h2 class="section-title">BATTING ORDER</h2>
        <div id="order-slots"></div>
        <div class="order-hint">Click a drafted fielder below to slot them in. Order doesn't need to be finished until your roster is full.</div>
        <div class="order-tray" id="order-tray"></div>
      </div>
    </div>

    <div class="bullpen-panel">
      <h2 class="section-title">BULLPEN</h2>
      <div class="bullpen-slots" id="bullpen-slots"></div>
    </div>
  </div>
</main>

<script>
  const teams = [
    {
      team: "Yankees", era: "1990s",
      players: [
        { name: "Derek Jeter", pos: "SS", war: 6.6 },
        { name: "Bernie Williams", pos: "OF/CF", war: 5.9 },
        { name: "Paul O'Neill", pos: "OF", war: 4.2 },
        { name: "Tino Martinez", pos: "1B", war: 3.8 },
        { name: "Chuck Knoblauch", pos: "2B", war: 3.1 },
        { name: "Scott Brosius", pos: "3B", war: 4.7 },
        { name: "Jorge Posada", pos: "C", war: 3.9 },
        { name: "Chad Curtis", pos: "OF", war: 2.0 },
        { name: "Darryl Strawberry", pos: "DH", war: 1.4 },
        { name: "David Cone", pos: "SP", war: 5.5 },
        { name: "Andy Pettitte", pos: "SP", war: 3.6 },
        { name: "David Wells", pos: "SP", war: 5.1 },
        { name: "Mariano Rivera", pos: "RP", war: 4.6 },
        { name: "Jeff Nelson", pos: "RP", war: 1.9 },
      ]
    },
    {
      team: "Reds", era: "1970s",
      players: [
        { name: "Johnny Bench", pos: "C", war: 5.3 },
        { name: "Tony Perez", pos: "1B", war: 2.6 },
        { name: "Joe Morgan", pos: "2B", war: 9.6 },
        { name: "Dave Concepcion", pos: "SS", war: 5.2 },
        { name: "Pete Rose", pos: "3B", war: 5.4 },
        { name: "George Foster", pos: "OF", war: 6.7 },
        { name: "Cesar Geronimo", pos: "OF/CF", war: 2.8 },
        { name: "Ken Griffey Sr.", pos: "OF", war: 4.7 },
        { name: "Dan Driessen", pos: "DH", war: 2.1 },
        { name: "Don Gullett", pos: "SP", war: 3.9 },
        { name: "Gary Nolan", pos: "SP", war: 3.2 },
        { name: "Fred Norman", pos: "SP", war: 2.4 },
        { name: "Rawly Eastwick", pos: "RP", war: 2.7 },
        { name: "Will McEnaney", pos: "RP", war: 1.1 },
      ]
    },
    {
      team: "Cubs", era: "2010s",
      players: [
        { name: "Willson Contreras", pos: "C", war: 3.4 },
        { name: "Anthony Rizzo", pos: "1B", war: 5.5 },
        { name: "Ben Zobrist", pos: "2B", war: 3.9 },
        { name: "Addison Russell", pos: "SS", war: 3.9 },
        { name: "Kris Bryant", pos: "3B", war: 7.7 },
        { name: "Kyle Schwarber", pos: "OF", war: 0.9 },
        { name: "Dexter Fowler", pos: "OF/CF", war: 4.0 },
        { name: "Jason Heyward", pos: "OF", war: 1.5 },
        { name: "Miguel Montero", pos: "DH", war: 0.6 },
        { name: "Jon Lester", pos: "SP", war: 4.0 },
        { name: "Kyle Hendricks", pos: "SP", war: 5.1 },
        { name: "Jake Arrieta", pos: "SP", war: 3.6 },
        { name: "Aroldis Chapman", pos: "RP", war: 1.9 },
        { name: "Hector Rondon", pos: "RP", war: 1.1 },
      ]
    },
  ];

  const spinBtn = document.getElementById("spin-btn");
  const teamReel = document.getElementById("reel-team");
  const eraReel = document.getElementById("reel-era");
  const teamValue = document.getElementById("reel-team-value");
  const eraValue = document.getElementById("reel-era-value");
  const poolPanel = document.getElementById("pool-panel");
  const orderSlotsEl = document.getElementById("order-slots");
  const orderTrayEl = document.getElementById("order-tray");
  const bullpenSlotsEl = document.getElementById("bullpen-slots");
  const dhSlot = document.getElementById("dh-slot");
  const dhName = document.getElementById("dh-name");

  // Measured in the browser: at 9px mono each character is 5.4 units, and the ring's
  // inner chord at the name line is ~35.7, so 6 fit and a 7th spills over.
  const TOKEN_NAME_MAX_CHARS = 6;
  const NAME_SUFFIXES = /^(jr|sr|ii|iii|iv)\.?$/i;
  const DIAMOND_POSITIONS = ["C", "1B", "2B", "3B", "SS", "LF", "CF", "RF"];

  let currentPool = [];
  let selectedIdx = null;
  let hasSpun = false;
  let spinning = false;
  // One pick per spin. Only this spin's pick can be undone; earlier picks are locked in.
  let pickThisSpin = null;
  const diamondAssign = {}; // pos -> player object
  let dhAssign = null;
  const bullpenRoles = ["SP", "SP", "SP", "RP", "RP"];
  const bullpenAssign = new Array(5).fill(null);
  const orderList = new Array(9).fill(null); // player objects, in batting order
  const TOTAL_SLOTS = DIAMOND_POSITIONS.length + 1 + bullpenRoles.length;

  const isPitcher = p => p.pos === "SP" || p.pos === "RP";

  function draftedPlayers() {
    return [...Object.values(diamondAssign), ...(dhAssign ? [dhAssign] : []), ...bullpenAssign.filter(Boolean)];
  }

  function rosterFull() {
    return draftedPlayers().length === TOTAL_SLOTS;
  }

  function canFillOpenSlot(p) {
    const openField = DIAMOND_POSITIONS.some(pos => !diamondAssign[pos]) || !dhAssign;
    const openBullpen = bullpenAssign.some(slot => !slot);
    return openField || (isPitcher(p) && openBullpen);
  }

  function canPick() {
    return selectedIdx !== null && pickThisSpin === null;
  }

  function takeSelected() {
    const p = currentPool[selectedIdx];
    currentPool.splice(selectedIdx, 1);
    selectedIdx = null;
    pickThisSpin = p;
    return p;
  }

  function undoPick(p) {
    if (p !== pickThisSpin) return false;
    currentPool.push(p);
    removeFromOrder(p);
    pickThisSpin = null;
    return true;
  }

  function canSpin() {
    if (spinning || rosterFull()) return false;
    return !hasSpun || pickThisSpin !== null || !currentPool.some(canFillOpenSlot);
  }

  function buildBullpenSlots() {
    bullpenSlotsEl.innerHTML = "";
    bullpenRoles.forEach((role, i) => {
      const slot = document.createElement("div");
      slot.className = "bp-slot" + (bullpenAssign[i] ? " filled" : "");
      slot.innerHTML = `<span class="bp-role">${role} ${i < 3 ? (i+1) : (i-2)}</span>${bullpenAssign[i] ? bullpenAssign[i].name : "empty"}`;
      slot.addEventListener("click", () => assignToBullpen(i));
      bullpenSlotsEl.appendChild(slot);
    });
  }

  function assignToBullpen(i) {
    if (bullpenAssign[i]) {
      if (undoPick(bullpenAssign[i])) bullpenAssign[i] = null;
    } else if (canPick() && isPitcher(currentPool[selectedIdx])) {
      bullpenAssign[i] = takeSelected();
    }
    renderAll();
  }

  document.querySelectorAll(".pos-slot").forEach(slot => {
    slot.addEventListener("click", () => {
      const pos = slot.getAttribute("data-pos");
      if (diamondAssign[pos]) {
        if (undoPick(diamondAssign[pos])) delete diamondAssign[pos];
      } else if (canPick()) {
        diamondAssign[pos] = takeSelected();
      }
      renderAll();
    });
  });

  dhSlot.addEventListener("click", () => {
    if (dhAssign) {
      if (undoPick(dhAssign)) dhAssign = null;
    } else if (canPick()) {
      dhAssign = takeSelected();
    }
    renderAll();
  });

  function removeFromOrder(player) {
    const i = orderList.indexOf(player);
    if (i > -1) orderList[i] = null;
  }

  function assignedFielders() {
    return [...Object.values(diamondAssign), ...(dhAssign ? [dhAssign] : [])];
  }

  function addToOrder(player) {
    const emptyIdx = orderList.indexOf(null);
    if (emptyIdx > -1) orderList[emptyIdx] = player;
  }

  function toggleOrderSlot(i) {
    if (orderList[i]) orderList[i] = null;
  }

  function poolHint() {
    if (rosterFull()) return "Roster complete.";
    if (!hasSpun) return "Spin the reels to reveal a team & era.";
    if (pickThisSpin) return `Drafted ${pickThisSpin.name}. Spin for your next team.`;
    if (!currentPool.some(canFillOpenSlot)) return "Nobody here fits your open slots. Spin again.";
    return "Pick one player, then click an open slot.";
  }

  function renderPool() {
    poolPanel.innerHTML = "";
    const hint = document.createElement("p");
    hint.className = "pool-hint";
    hint.textContent = poolHint();
    poolPanel.appendChild(hint);

    const locked = pickThisSpin !== null || rosterFull();
    currentPool.forEach((p, i) => {
      const card = document.createElement("div");
      card.className = "pool-card" + (i === selectedIdx ? " selected" : "") + (locked ? " locked" : "");
      card.innerHTML = `
        <div class="pinfo">
          <span class="pos-badge">${p.pos}</span>
          <span class="pname">${p.name}</span>
        </div>
        <div class="pstat">
          <span class="pstat-label">WAR</span>
          <span class="pwar">${p.war.toFixed(1)}</span>
        </div>
      `;
      card.addEventListener("click", () => { selectedIdx = i; renderAll(); });
      poolPanel.appendChild(card);
    });
  }

  function tokenName(fullName) {
    const parts = fullName.split(" ").filter(part => !NAME_SUFFIXES.test(part));
    const last = parts[parts.length - 1];
    return last.length > TOKEN_NAME_MAX_CHARS ? last.slice(0, TOKEN_NAME_MAX_CHARS - 1) + "." : last;
  }

  function renderDiamond() {
    document.querySelectorAll(".pos-slot").forEach(slot => {
      const pos = slot.getAttribute("data-pos");
      const nameEl = slot.querySelector(".pos-name");
      if (diamondAssign[pos]) {
        slot.classList.add("filled");
        nameEl.textContent = tokenName(diamondAssign[pos].name);
      } else {
        slot.classList.remove("filled");
        nameEl.textContent = "";
      }
    });
    if (dhAssign) {
      dhSlot.classList.add("filled");
      dhName.textContent = dhAssign.name;
      dhName.style.color = "";
      dhName.style.fontStyle = "normal";
    } else {
      dhSlot.classList.remove("filled");
      dhName.textContent = "empty";
      dhName.style.color = "var(--ink-soft)";
      dhName.style.fontStyle = "italic";
    }
  }

  function renderOrder() {
    orderSlotsEl.innerHTML = "";
    orderList.forEach((p, i) => {
      const slot = document.createElement("div");
      slot.className = "order-slot" + (p ? "" : " empty");
      slot.innerHTML = `<span class="order-num">${i + 1}</span>${p ? p.name : "empty"}`;
      slot.addEventListener("click", () => { toggleOrderSlot(i); renderAll(); });
      orderSlotsEl.appendChild(slot);
    });

    orderTrayEl.innerHTML = "";
    assignedFielders().forEach(p => {
      if (!orderList.includes(p)) {
        const chip = document.createElement("div");
        chip.className = "order-chip";
        chip.textContent = p.name;
        chip.addEventListener("click", () => { addToOrder(p); renderAll(); });
        orderTrayEl.appendChild(chip);
      }
    });
  }

  function renderAll() {
    renderPool();
    renderDiamond();
    renderOrder();
    buildBullpenSlots();
    spinBtn.disabled = !canSpin();
  }

  const REEL_TEAMS = ["Yankees", "Reds", "Cubs", "Dodgers", "Red Sox", "Cardinals", "Giants", "Braves", "Tigers", "Athletics", "Crawfords", "Mariners"];
  const REEL_ERAS = ["1880s", "1900s", "1920s", "1930s", "1950s", "1960s", "1970s", "1980s", "1990s", "2000s", "2010s", "2020s"];
  const TEAM_STOP_TICK = 14;
  const ERA_STOP_TICK = 20;
  const pickFrom = list => list[Math.floor(Math.random() * list.length)];

  spinBtn.addEventListener("click", () => {
    spinning = true;
    spinBtn.disabled = true;
    teamReel.classList.add("spinning");
    eraReel.classList.add("spinning");
    const chosen = pickFrom(teams);

    let ticks = 0;
    const interval = setInterval(() => {
      ticks++;
      if (ticks < TEAM_STOP_TICK) {
        teamValue.textContent = pickFrom(REEL_TEAMS);
      } else if (ticks === TEAM_STOP_TICK) {
        teamValue.textContent = chosen.team;
        teamReel.classList.remove("spinning");
      }
      eraValue.textContent = ticks < ERA_STOP_TICK ? pickFrom(REEL_ERAS) : chosen.era;
      if (ticks >= ERA_STOP_TICK) {
        clearInterval(interval);
        eraReel.classList.remove("spinning");
        spinning = false;
        hasSpun = true;

        // New spin replaces the pool; the roster built so far stays.
        const drafted = draftedPlayers();
        currentPool = chosen.players.filter(p => !drafted.some(d => d.name === p.name));
        selectedIdx = null;
        pickThisSpin = null;
        renderAll();
      }
    }, 70);
  });

  renderAll();
</script>

</body>
</html>
